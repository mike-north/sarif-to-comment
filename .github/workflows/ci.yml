# Continuous integration: lint, type-check, API report and reference-docs
# freshness, the Changesets release plan (no pending changeset may take the
# package to 1.0.0 or higher) and the full test suite, on every push to main
# and every pull request, on each supported Node major. Read-only; it never
# publishes (publishing is .github/workflows/publish.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.12.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install exactly the locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, type-check, API/docs freshness, release plan and tests
        run: pnpm run check
