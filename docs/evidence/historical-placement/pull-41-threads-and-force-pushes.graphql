query($owner: String!, $repo: String!, $number: Int!) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $number) {
      headRefOid
      baseRefOid
      reviewThreads(first: 100) {
        nodes {
          path isOutdated line originalLine diffSide startLine
          comments(first: 5) { nodes { databaseId state outdated line originalLine position originalPosition commit { oid } originalCommit { oid } pullRequestReview { databaseId state } } }
        }
      }
      timelineItems(first: 100, itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT]) {
        filteredCount
        nodes { __typename ... on HeadRefForcePushedEvent { createdAt beforeCommit { oid } afterCommit { oid } } }
      }
    }
  }
}
