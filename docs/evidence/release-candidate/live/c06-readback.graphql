query {
  repository(owner: "mike-north", name: "doc-linter") {
    original: pullRequest(number: 107) {
      number state isDraft baseRefName headRefName headRefOid
      reviews(first: 10) { nodes { databaseId state body commit { oid } comments(first: 10) { nodes { path line originalLine body } } } }
      timelineItems(first: 20, itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT]) { nodes { ... on HeadRefForcePushedEvent { beforeCommit { oid } afterCommit { oid } } } }
